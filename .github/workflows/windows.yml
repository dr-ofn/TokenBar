name: Windows

# Tests TokenBar for Windows, builds TokenBar.exe with PyInstaller, smoke-tests the built program (the console program,
# TokenBar.exe's command-line mode, and its tray mode through `--selftest-gui`, which quits itself) and keeps the zip and its .sha256 as an artifact. A tag `v*` also adds both
# to that release (creating it when `gh release create` has not yet: whichever comes first, the other adds to it).
# No `paths` filter on push: it would apply to a tag push as well, and a tag whose commit left windows/ alone would
# never build. Pull requests keep it.

on:
  push:
    branches: [main, windows]
    tags: ["v*"]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false      # nothing after this needs to push: the token is not left in .git/config

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Version
        id: version
        # The tag name reaches the script as an environment variable, never pasted into its text: a tag is something a
        # person chooses (`v1";calc;"` is a valid one) and an expression is expanded before PowerShell reads it.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = python -c "import tokenbar; print(tokenbar.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            # A hyphenated tag (v9.0.1-rc1) is a pre-release: scripts/release-audit.sh lets it differ from the version
            # files, so the build does too. Any other tag must be v + the version.
            if ($env:REF_NAME -like "*-*") {
              Write-Host "pre-release tag $($env:REF_NAME), tokenbar.__version__ is $v"
            } else {
              throw "tag $($env:REF_NAME) does not match tokenbar.__version__ ($v)"
            }
          }

      - name: Workflow file is valid YAML
        run: python -c "import yaml; yaml.safe_load(open('../.github/workflows/windows.yml', encoding='utf-8')); print('ok')"

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: python build.py

      - name: Smoke test, console program (made-up home folder, headless)
        run: python tools/smoke.py dist/TokenBar/tokenbar-cli.exe

      - name: Smoke test, TokenBar.exe in command-line mode (no window, no tray)
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "tb-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); from fixture_home import make_fixture_home; make_fixture_home(r'$tmp\home')"
          $env:TOKENBAR_PRICES_PINNED = "1"
          $env:TOKENBAR_OFFLINE = "1"
          $p = Start-Process -FilePath dist/TokenBar/TokenBar.exe -Wait -PassThru -ArgumentList @("--home", "$tmp\home", "--db", "$tmp\usage.sqlite", "--window", "all", "--json", "--output", "$tmp\out.json")
          if ($p.ExitCode -ne 0) { throw "TokenBar.exe exited with $($p.ExitCode)" }
          $j = Get-Content "$tmp\out.json" -Raw | ConvertFrom-Json
          if ($j.total -ne 34990 -or $j.calls -ne 72) { throw "unexpected totals: $($j.total) tokens, $($j.calls) calls" }
          "TokenBar.exe: $($j.total) tokens, $($j.calls) calls"

      - name: Smoke test, TokenBar.exe console mode (output to a file handle and to a pipe, as a person at a prompt has it)
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "tb-console"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); from fixture_home import make_fixture_home; make_fixture_home(r'$tmp\home')"
          $env:TOKENBAR_PRICES_PINNED = "1"
          $env:TOKENBAR_OFFLINE = "1"
          $exe = (Resolve-Path dist/TokenBar/TokenBar.exe).Path
          # (1) `TokenBar.exe --json > file`: standard output is a file the process inherits; it has no console of its own.
          $p = Start-Process -FilePath $exe -Wait -PassThru -RedirectStandardOutput "$tmp\redirected.json" -RedirectStandardError "$tmp\redirected.err" -ArgumentList @("--home", "$tmp\home", "--db", "$tmp\usage1.sqlite", "--window", "all", "--json")
          if ($p.ExitCode -ne 0) { throw "TokenBar.exe > file exited with $($p.ExitCode): $(Get-Content "$tmp\redirected.err" -Raw)" }
          $raw = Get-Content "$tmp\redirected.json" -Raw
          if ([string]::IsNullOrWhiteSpace($raw)) { throw "TokenBar.exe --json > file wrote nothing" }
          $j = $raw | ConvertFrom-Json
          if ($j.total -ne 34990 -or $j.calls -ne 72) { throw "file: unexpected totals: $($j.total) tokens, $($j.calls) calls" }
          # (2) `TokenBar.exe --json | ...`: a pipe (PowerShell waits for a windowed program only when its output is piped).
          $text = & $exe --home "$tmp\home" --db "$tmp\usage2.sqlite" --window all --json | Out-String
          if ([string]::IsNullOrWhiteSpace($text)) { throw "TokenBar.exe --json | ... wrote nothing" }
          $j = $text | ConvertFrom-Json
          if ($j.total -ne 34990 -or $j.calls -ne 72) { throw "pipe: unexpected totals: $($j.total) tokens, $($j.calls) calls" }
          # (3) a flag it does not know is an error with a message, not a window that opens.
          $p = Start-Process -FilePath $exe -Wait -PassThru -RedirectStandardError "$tmp\bogus.err" -ArgumentList @("--bogus-flag")
          if ($p.ExitCode -eq 0) { throw "TokenBar.exe --bogus-flag exited 0" }
          if ((Get-Content "$tmp\bogus.err" -Raw) -notmatch "unrecognized arguments") { throw "no error message for an unknown flag" }
          "TokenBar.exe console mode: file and pipe both gave $($j.total) tokens, $($j.calls) calls"

      - name: Smoke test, TokenBar.exe tray mode (made-up home, own index, quits itself)
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "tb-gui-smoke"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); from fixture_home import make_fixture_home; make_fixture_home(r'$tmp\home')"
          $env:TOKENBAR_PRICES_PINNED = "1"
          $env:TOKENBAR_OFFLINE = "1"
          $out = "$tmp\gui-selftest.txt"
          # The windowed program has no stderr: its verdict is the file. A process that is merely alive proves nothing.
          $p = Start-Process -FilePath dist/TokenBar/TokenBar.exe -PassThru -ArgumentList @("--selftest-gui", "--home", "$tmp\home", "--db", "$tmp\usage.sqlite", "--selftest-out", $out)
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "TokenBar.exe --selftest-gui did not end within 120 s" }
          $p.WaitForExit()
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { "(no output file)" }
          "exit code $($p.ExitCode): $text"
          if ($p.ExitCode -ne 0) { throw "TokenBar.exe --selftest-gui exited with $($p.ExitCode)" }
          if ($text -notmatch "GUI SELFTEST OK") { throw "no 'GUI SELFTEST OK' in the output file" }
          if ($text -notmatch "tokens=34990 calls=72 ") { throw "unexpected totals in the output file" }
          # It must not have written to the user's own places.
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name TokenBar -ErrorAction SilentlyContinue) { throw "the Run key was written" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "TokenBar\usage.sqlite")) { throw "the user's own index was written" }

      - name: Zip contents
        run: |
          Get-ChildItem dist/TokenBar-Windows-*.zip | ForEach-Object { "$($_.Name) $([math]::Round($_.Length/1MB, 1)) MB" }
          Expand-Archive dist/TokenBar-Windows-*.zip -DestinationPath $env:RUNNER_TEMP/unzipped
          foreach ($f in "TokenBar/TokenBar.exe", "TokenBar/tokenbar-cli.exe", "TokenBar/README.md", "TokenBar/LICENSE", "TokenBar/docs/HARNESSES.md") {
            if (-not (Test-Path "$env:RUNNER_TEMP/unzipped/$f")) { throw "missing in the zip: $f" }
          }

      - name: Checksum
        run: |
          $zip = Get-ChildItem dist/TokenBar-Windows-*.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($zip.FullName).sha256", "$hash  $($zip.Name)`n")
          Get-Content "$($zip.FullName).sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: TokenBar-Windows-${{ steps.version.outputs.version }}
          path: |
            windows/dist/TokenBar-Windows-*.zip
            windows/dist/TokenBar-Windows-*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes: `contents: write` for the release and nothing else (the workflow default is read-only),
    # no checkout (no code of the repository runs here), and the tag name arrives as the TAG variable below.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TokenBar-Windows-${{ needs.build.outputs.version }}
          path: assets
      - name: Add the zip and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # An existing release (made by scripts/release.sh's command) is only added to: its title and notes stay.
          # A hyphenated tag (v9.0.0-rc1) is a pre-release, never the "Latest" one.
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "${FLAGS[@]}" --title "TokenBar ${TAG#v}" --notes "TokenBar for Windows (unsigned: see windows/README.md for the SmartScreen step)."
          gh release upload "$TAG" assets/TokenBar-Windows-*.zip assets/TokenBar-Windows-*.zip.sha256 --clobber
